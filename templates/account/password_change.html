{% extends "base.html" %}

{% block title %}Change password{% endblock %}

{% block screen %}
<section class="screen narrow active" id="s-change-password">
  <div class="scroll">
    <h1>Change your password</h1>
    <form method="post" id="change-form" action="{% url 'account_change_password' %}">
      {% csrf_token %}
      {% include "partials/_auth_fields.html" %}
      {{ redirect_field }}
    </form>
  </div>
  <div class="actionbar"><button class="btn block" type="submit" form="change-form">Change password</button></div>
</section>
{% endblock %}
