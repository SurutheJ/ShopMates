{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block screen %}
<section class="screen narrow active" id="s-reset-done">
  <div class="scroll">
    <div class="empty"><div class="big"><svg class="i" aria-hidden="true"><use href="#i-check-circle"/></svg></div>
      <h1>Check your email</h1>
      <p class="sm">If that email has an account, a link is on its way. Check your spam folder if it does not show up in a few minutes.</p>
      <a class="btn ghost" href="{% url 'account_login' %}">Back to log in</a></div>
  </div>
</section>
{% endblock %}
