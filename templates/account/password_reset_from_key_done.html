{% extends "base.html" %}

{% block title %}Password changed{% endblock %}

{% block screen %}
<section class="screen narrow active" id="s-reset-complete">
  <div class="scroll">
    <div class="empty"><div class="big"><svg class="i" aria-hidden="true"><use href="#i-check-circle"/></svg></div>
      <h1>Password changed</h1>
      <p class="sm">You can log in with your new password.</p>
      <a class="btn" href="{% url 'account_login' %}">Log in</a></div>
  </div>
</section>
{% endblock %}
